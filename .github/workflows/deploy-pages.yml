name: Deploy ZeroExoTV to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          # 仓库名 ZeroExoTV；自定义域名时改成 /
          VITE_BASE_PATH: ./
        run: pnpm build

      - name: Package MCP
        run: |
          cd mcp-server
          npm install --no-audit --no-fund
          npm run build
          npm pack --pack-destination ../dist/downloads
          cd ..
          MCP_VERSION=$(node -p "require('./mcp-server/package.json').version")
          cp "dist/downloads/zeroexo-mcp-server-${MCP_VERSION}.tgz" dist/downloads/zeroexo-mcp-server.tgz

      - name: Package ComfyUI plugin
        run: |
          cd comfyui-plugin
          zip -r ../dist/downloads/ComfyUI_ZeroExoNodes.zip ComfyUI_ZeroExoNodes \
            -x '*/__pycache__/*' '*.pyc'
          cp ../dist/downloads/ComfyUI_ZeroExoNodes.zip \
            "../dist/downloads/ComfyUI_ZeroExoNodes-${GITHUB_SHA::7}.zip"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没启用 Pages 时自动创建，不需要手动去 Settings 点
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
